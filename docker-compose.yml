name: ai-employee-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ai_employee
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_employee"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs migrations once, then exits. Both api and worker wait for it,
  # so neither can start against an out-of-date schema.
  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/ai_employee
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/ai_employee
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: dev
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/ai_employee
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: dev
      DEBUG: "true"
      SLOW_MODE: "true"
    volumes:
      - ./backend:/app
    command: ["arq", "app.workers.main.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
