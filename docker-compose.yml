name: ai-employee-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ai_employee
    ports:
      # Host port deliberately not 5432: a locally installed
      # PostgreSQL would win the binding and silently receive our
      # connections. Containers still talk over 5432 internally.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_employee"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      # Same reasoning as postgres above.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs migrations once, then exits. Both api and worker wait for it,
  # so neither can start against an out-of-date schema.
  migrate:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/ai_employee
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    # Same live mount as api and worker. Without it this service runs the
    # migrations baked into the image, so a newly written migration is
    # invisible until someone remembers to rebuild - and the failure
    # looks like "can't locate revision", which does not point at the
    # real cause.
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/ai_employee
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: dev
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/ai_employee
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: dev
      DEBUG: "true"
      SLOW_MODE: "true"
    volumes:
      - ./backend:/app
    command: ["arq", "app.workers.main.WorkerSettings"]
    # The image's default healthcheck fetches /healthz, but the worker
    # serves no HTTP - that is the whole point of splitting it from the
    # API. Use arq's own check, which reads the heartbeat the worker
    # writes to Redis, so this proves it is consuming jobs rather than
    # merely running.
    healthcheck:
      test: ["CMD", "arq", "app.workers.main.WorkerSettings", "--check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      NODE_ENV: development
      # Service name, not localhost: inside this container localhost
      # is the container itself and the request never reaches the API.
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules: the host has Windows
      # binaries and the container is Alpine Linux.
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
