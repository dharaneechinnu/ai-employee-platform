# Serves the built app and forwards /api to the API, so the browser sees
# one origin: the refresh cookie stays same-site and no CORS is needed.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;  # file uploads and voice notes

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr, not the incoming header: this server is the edge,
        # and a client must not choose the address its rate limit counts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live run updates are server-sent events: pass them through as
        # they come, and let a quiet stream stay open between keepalives.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Built files carry a content hash in their name: cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Every other path is a page of the app: let the router handle it.
    # index.html itself is never cached, so a deploy is seen at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
